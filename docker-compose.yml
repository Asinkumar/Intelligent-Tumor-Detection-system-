version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: breast-cancer-api

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    depends_on:
      - mlflow

    restart: unless-stopped

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

  mlflow:

    image: python:3.11-slim

    container_name: mlflow-server

    working_dir: /app

    volumes:
      - .:/app
      - mlflow_data:/app/mlruns

    command: >
      bash -c "
      pip install mlflow &&
      mlflow ui
      --host 0.0.0.0
      --port 5000
      "

    ports:
      - "5000:5000"

    restart: unless-stopped

volumes:

  mlflow_data: