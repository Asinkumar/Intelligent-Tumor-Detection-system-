name: CD - Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC with Google Drive support
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[gdrive]==3.67.1"
          pip install "pyOpenSSL==24.2.1"

      - name: Create Google Drive service account file
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > /tmp/gdrive-sa.json
          chmod 600 /tmp/gdrive-sa.json

      - name: Configure DVC Google Drive authentication
        run: |
          dvc remote modify storage --local gdrive_use_service_account true
          dvc remote modify storage --local gdrive_service_account_json_file_path /tmp/gdrive-sa.json

      - name: Pull DVC artifacts
        run: |
          dvc pull

      - name: Verify required model files
        run: |
          echo "Checking DVC model artifacts..."
          test -f models/final_best_model.pkl
          test -f models/final_prediction_threshold.txt
          ls -lh models/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ayesin/tumor-decision-support:latest
            ayesin/tumor-decision-support:${{ github.sha }}