name: CI - Intelligent Tumor Decision Support System

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Install project dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Install DVC with Google Drive support
      #    Pin compatible PyDrive2 / OpenSSL stack
      # --------------------------------------------------
      - name: Install DVC
        run: |
          pip install "dvc[gdrive]==3.67.1"
          pip install "PyDrive2==1.19.0"
          pip install "pyOpenSSL==24.2.1" "cryptography==43.0.3"

          dvc --version
          python -c "import pydrive2; print('PyDrive2 OK')"
          python -c "from OpenSSL import crypto; print('pyOpenSSL OK')"

      # --------------------------------------------------
      # 5. Create Google Drive service-account file
      # --------------------------------------------------
      - name: Create Google Drive service account file
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > /tmp/gdrive-sa.json
          chmod 600 /tmp/gdrive-sa.json

      # --------------------------------------------------
      # 6. Configure DVC Google Drive authentication
      # --------------------------------------------------
      - name: Configure DVC remote authentication
        run: |
          dvc remote modify storage --local gdrive_use_service_account true
          dvc remote modify storage --local gdrive_service_account_json_file_path /tmp/gdrive-sa.json

      # --------------------------------------------------
      # 7. Pull DVC artifacts
      # --------------------------------------------------
      - name: Pull DVC artifacts
        run: |
          dvc pull

      # --------------------------------------------------
      # 8. Verify required model files
      # --------------------------------------------------
      - name: Verify model artifacts
        run: |
          test -f models/final_best_model.pkl
          test -f models/final_prediction_threshold.txt
          ls -lh models/

      # --------------------------------------------------
      # 9. Verify Python source code
      # --------------------------------------------------
      - name: Python syntax check
        run: |
          python -m compileall app src tests

      # --------------------------------------------------
      # 10. Verify important modules can be imported
      # --------------------------------------------------
      - name: Verify core dependencies
        run: |
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import sklearn; print('Scikit-learn OK')"
          python -c "import mlflow; print('MLflow OK')"
          python -c "import pandas; print('Pandas OK')"
          python -c "import pytest; print('Pytest OK')"

      # --------------------------------------------------
      # 11. Run automated tests
      # --------------------------------------------------
      - name: Run automated tests
        run: |
          python -m pytest tests -v

      # --------------------------------------------------
      # 12. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t intelligent-tumor-decision-support:ci .