name: CI - Intelligent Tumor Decision Support System

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Install project dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Verify Python source code
      # --------------------------------------------------
      - name: Python syntax check
        run: |
          python -m compileall app src

      # --------------------------------------------------
      # 5. Verify important modules can be imported
      #    Do not import app.main here because the model
      #    artifacts are stored remotely using DVC.
      # --------------------------------------------------
      - name: Verify core dependencies
        run: |
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import sklearn; print('Scikit-learn OK')"
          python -c "import mlflow; print('MLflow OK')"
          python -c "import pandas; print('Pandas OK')"

      # --------------------------------------------------
      # 6. Validate DVC installation
      # --------------------------------------------------
      - name: Verify DVC
        run: |
          pip install dvc
          dvc --version

      # --------------------------------------------------
      # 7. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t intelligent-tumor-decision-support:ci .